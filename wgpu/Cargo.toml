# Pocket Requiem drawn with wgpu: in a browser tab over WebGPU (wasm32), and on
# the machine that builds it (Metal), where a frame can be written to a file.
#
# The game is `requiem-sim`, as on every device. The pack is the PS Vita's
# (profiles/vita30.json) and the programs are the PS Vita's, in WGSL.
# Everything that is not this game's is PocketJS's browser kernel
# (vendor/pocketjs/devices/web/pocket-web-wgpu): the GPU device and its
# screens, ranges of a pack, the page around the canvas.
#
#   bun tools/wgpu.ts build | serve | shot | check     (from the repository root)

[package]
name = "requiem-wgpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Requiem's wgpu renderer: the PS Vita's passes, in a browser tab and on the build machine"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "requiem-shot"
path = "src/bin/shot.rs"

[dependencies]
requiem-sim = { path = "../crates/requiem-sim" }
requiem-pack = { path = "../crates/requiem-pack" }
pocket-web-wgpu = { path = "../vendor/pocketjs/devices/web/pocket-web-wgpu" }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The command line tool that writes the JavaScript side must be this version (tools/wgpu.ts checks).
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[workspace]
resolver = "2"
