# The simulation and the device-independent runtime behind a C interface, for
# the 3DS host in ../src. citro3d is a C library made mostly of `static inline`
# functions, so the renderer is C and this crate is a static library.
#
# Standalone workspace: armv6k-nintendo-3ds needs a nightly compiler and
# build-std (.cargo/config.toml, rust-toolchain.toml).
#
#   cargo build --release      (in this directory)

[package]
name = "requiem-n3ds-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "requiem_n3ds_core"
crate-type = ["staticlib"]

[dependencies]
# The ARM11's VFP has a square root instruction. The transcendentals are the simulation's single-precision
# kernels: libm's go through doubles, which the VFP11 computes at half the speed, and the army's tick and
# the effects ask for thousands a frame.
requiem-sim = { path = "../../crates/requiem-sim", default-features = false, features = ["hw-sqrt", "single-float"] }
requiem-pack = { path = "../../crates/requiem-pack", default-features = false }
requiem-handheld = { path = "../../crates/requiem-handheld", default-features = false }

[profile.release]
# The target defaults to unwinding; a static library in a libctru program has no unwinder.
panic = "abort"
opt-level = 3
codegen-units = 1
# Thin: with this crate's nightly, the full pass fails to load the simulation's bitcode.
lto = "thin"

[workspace]
